# Render blueprint for the Brute Force Lab.
# In the Render dashboard: New + -> Blueprint -> pick your repo. Render reads
# this file and creates the service. Set LAB_GATE_PASSWORD afterwards (see
# README) so the lab is password-gated for your class.
services:
  - type: web
    name: brute-force-lab
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # One worker (with threads) so the in-memory lockout counter used by the
    # 'impossible' level is shared across all requests. Multiple workers each
    # keep their own copy and the lockout would not work. One worker handles a
    # classroom fine.
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8"
    healthCheckPath: /healthz
    envVars:
      - key: LAB_SECRET_KEY
        generateValue: true          # Render generates a random secret
      - key: LAB_GATE_USER
        value: student               # the class username (change if you like)
      - key: LAB_GATE_PASSWORD
        sync: false                  # you set this in the dashboard, kept secret
